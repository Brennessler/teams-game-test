<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Teams Escape Room Test</title>

<style>

body{
    background:#1d1d1d;
    color:white;
    font-family:Segoe UI;
    text-align:center;
    padding:40px;
}

.card{
    width:600px;
    margin:auto;
    background:#2f2f2f;
    padding:30px;
    border-radius:12px;
}

button{
    padding:12px;
    margin:5px;
    cursor:pointer;
}

input,
select{
    padding:10px;
    width:220px;
}

</style>

</head>

<body>

<div class="card">

<h1>Teams Escape Room Test</h1>

<h2 id="counter">
Counter: 0
</h2>

<h2 id="activePlayer">
Active Player: none
</h2>

<hr>

<input
id="playerName"
placeholder="Your Name"
/>

<br><br>

<select id="roomSelect">

<option value="alpha">
Room Alpha
</option>

<option value="beta">
Room Beta
</option>

</select>

<br><br>

<button onclick="joinGame()">
Join
</button>

<hr>

<button id="clickButton" onclick="increaseCounter()">
+1 Counter
</button>

<button onclick="becomeLeader()">
Become Active Player
</button>

<br><br>

<div id="status"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
getDatabase,
ref,
set,
get,
onValue
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {

  apiKey: "AIzaSyDFBUCUy87krz4xj4GD0xRqLqfEkegiwtI",

  authDomain: "teams-game-test.firebaseapp.com",

  databaseURL: "https://teams-game-test-default-rtdb.europe-west1.firebasedatabase.app",

  projectId: "teams-game-test",

  storageBucket: "teams-game-test.firebasestorage.app",

  messagingSenderId: "414740614489",

  appId: "1:414740614489:web:b045f2f59f78b475705048",

  measurementId: "G-C9BCL58JSV"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

let myName = "";

let roomId = "alpha";

let unsubscribe = null;

function connectRoom() {

    roomId =
        document.getElementById(
            "roomSelect"
        ).value;

    const gameRef =
        ref(
            db,
            `rooms/${roomId}`
        );

    onValue(gameRef,(snapshot)=>{

        const data =
            snapshot.val();

        if(!data)
            return;

        document.getElementById("counter")
            .innerHTML =
            "Counter: " +
            data.counter;

        document.getElementById("activePlayer")
            .innerHTML =
            "Active Player: " +
            data.activePlayer;

        const allowed =
            data.activePlayer === myName;

        document.getElementById("clickButton")
            .disabled =
            !allowed;

    });

}

window.joinGame = function(){

    myName =
        document.getElementById(
            "playerName"
        ).value;

    if(!myName)
    {
        alert("Enter a name");
        return;
    }

    connectRoom();

    document.getElementById(
        "status"
    ).innerHTML =
        "Joined " +
        roomId +
        " as " +
        myName;
};

window.becomeLeader = async function(){

    if(!myName)
    {
        alert("Join first");
        return;
    }

    await set(
        ref(
            db,
            `rooms/${roomId}/activePlayer`
        ),
        myName
    );
};

window.increaseCounter = async function(){

    const roomRef =
        ref(
            db,
            `rooms/${roomId}`
        );

    const snapshot =
        await get(roomRef);

    const data =
        snapshot.val();

    if(data.activePlayer !== myName)
    {
        alert("Not your turn");
        return;
    }

    await set(
        ref(
            db,
            `rooms/${roomId}/counter`
        ),
        data.counter + 1
    );
};

</script>

</body>

</html>
