<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Teams Escape Room Test</title>

<style>
body{
    background:#1d1d1d;
    color:white;
    font-family:Segoe UI;
    text-align:center;
    padding:40px;
}

.card{
    width:600px;
    margin:auto;
    background:#2f2f2f;
    padding:30px;
    border-radius:12px;
}

button{
    padding:12px;
    margin:5px;
    cursor:pointer;
}

input,
select{
    padding:10px;
    width:220px;
}

#clickButton:disabled{
    opacity:0.4;
    cursor:not-allowed;
}
</style>
</head>

<body>

<div class="card">

<h1>Teams Escape Room Test</h1>

<h2 id="counter">Counter: 0</h2>

<h2 id="activePlayer">Active Player: none</h2>

<hr>

<input
id="playerName"
placeholder="Your Name"
/>

<br><br>

<select id="roomSelect">
<option value="alpha">Room Alpha</option>
<option value="beta">Room Beta</option>
</select>

<br><br>

<button onclick="joinGame()">
Join
</button>

<hr>

<button id="clickButton" onclick="increaseCounter()">
+1 Counter
</button>

<button onclick="becomeLeader()">
Become Active Player
</button>

<br><br>

<div id="status"></div>

<br>

<div id="teamsStatus">
Standalone Mode
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    get,
    onValue
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "DIN_API_KEY",
    authDomain: "teams-game-test.firebaseapp.com",
    databaseURL: "https://teams-game-test-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "teams-game-test",
    storageBucket: "teams-game-test.firebasestorage.app",
    messagingSenderId: "414740614489",
    appId: "1:414740614489:web:b045f2f59f78b475705048"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentPlayer = "";
let currentRoom = "";

function joinGame() {

    currentPlayer =
        document.getElementById("playerName").value.trim();

    currentRoom =
        document.getElementById("roomSelect").value;

    if (!currentPlayer) {
        alert("Enter your name");
        return;
    }

    document.getElementById("status").innerText =
        `Joined ${currentRoom} as ${currentPlayer}`;

    const roomRef = ref(db, `rooms/${currentRoom}`);

    onValue(roomRef, snapshot => {

        const data = snapshot.val();

        if (!data) return;

        document.getElementById("counter").innerText =
            "Counter: " + (data.counter || 0);

        document.getElementById("activePlayer").innerText =
            "Active Player: " +
            (data.activePlayer || "none");

        const isLeader =
            data.activePlayer === currentPlayer;

        document.getElementById("clickButton").disabled =
            !isLeader;

    });
}

async function increaseCounter() {

    if (!currentRoom) return;

    const roomRef = ref(db, `rooms/${currentRoom}`);

    const snapshot = await get(roomRef);

    let counter = 0;

    if (snapshot.exists()) {
        counter = snapshot.val().counter || 0;
    }

    await set(roomRef, {
        counter: counter + 1,
        activePlayer:
            snapshot.exists()
                ? snapshot.val().activePlayer || ""
                : ""
    });
}

async function becomeLeader() {

    if (!currentRoom) {
        alert("Join first");
        return;
    }

    const roomRef = ref(db, `rooms/${currentRoom}`);

    const snapshot = await get(roomRef);

    const currentCounter =
        snapshot.exists()
            ? snapshot.val().counter || 0
            : 0;

    await set(roomRef, {
        counter: currentCounter,
        activePlayer: currentPlayer
    });
}

/* KRITISK FIX */
window.joinGame = joinGame;
window.increaseCounter = increaseCounter;
window.becomeLeader = becomeLeader;

</script>

</body>
</html>
